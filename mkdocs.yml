site_name: AI Agent Governance Framework
site_description: Framework vendor-neutral para governar sistemas de IA e agentes do mandato executivo ao runtime.
site_author: Rodrigo Garcia Guimarães
site_url: https://rodgui.github.io/ai-agent-governance-framework/
repo_url: https://github.com/rodgui/ai-agent-governance-framework
repo_name: rodgui/ai-agent-governance-framework
edit_uri: edit/main/
copyright: CC BY 4.0 — Rodrigo Garcia Guimarães

# O conteúdo canônico vive na raiz do repositório, distribuído entre docs/,
# controls/, schemas/, templates/, examples/, references/ e consulting/.
# Servir a raiz preserva os links relativos entre essas pastas sem reescrita.
# site_src/ é montado por tools/scripts/build-docs-site.py a partir das pastas
# canônicas, preservando a estrutura de diretórios. Isso mantém válidos os links
# relativos que cruzam pastas (../../controls/README.md) sem nenhuma reescrita.
docs_dir: site_src
site_dir: site

# O MkDocs exclui /templates/ por padrão, assumindo diretório de tema. Aqui
# templates/ é conteúdo canônico, então o default precisa ser sobrescrito.
# O MkDocs prefixa um exclude padrão que contém '/templates/', assumindo
# diretório de tema. Aqui templates/ é conteúdo canônico; a semântica é
# gitignore, então a exclusão padrão é negada explicitamente.
exclude_docs: |
  !/templates/

theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tema claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Mantém as âncoras idênticas às do GitHub, preservando acentuação.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - pt
        - en

